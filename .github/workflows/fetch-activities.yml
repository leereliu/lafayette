name: 获取活动数据

on:
  workflow_dispatch:
    inputs:
      including_full_activities:
        description: "包含已满员(🈵)活动"
        required: false
        default: false
        type: boolean

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: 恢复 Token 缓存
        uses: actions/cache@v4
        with:
          path: .token_cache.json
          key: token-cache-${{ github.run_id }}
          restore-keys: |
            token-cache-

      - name: 安装依赖
        run: npm install

      - name: 创建配置文件
        run: |
          cat > config.ts << EOF
          // 微信登录凭证（固定不变）
          export const wxOpenId = "${{ secrets.WX_OPEN_ID }}";
          export const wxUnionId = "${{ secrets.WX_UNION_ID }}";
          EOF

      - name: 运行脚本
        run: |
          if [ "${{ inputs.including_full_activities }}" = "true" ]; then
            npm start -- --including-full-activities
          else
            npm start
          fi

      - name: 报告摘要（可复制）
        run: |
          echo "## 📋 活动报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>点击展开，选中即可复制</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<pre>" >> $GITHUB_STEP_SUMMARY
          cat *.txt | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' >> $GITHUB_STEP_SUMMARY
          echo "</pre>" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: 获取当前时间（北京时间 UTC+8）
        id: date
        run: echo "date=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: 上传生成的文件
        uses: actions/upload-artifact@v4
        with:
          name: activity-report-${{ steps.date.outputs.date }}
          path: "*.txt"
          retention-days: 30 # 保留30天

      - name: 显示文件列表
        run: |
          echo "生成的文件："
          ls -lh *.txt
